<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="description" content="宝贝时光 - 记录宝宝成长点滴">
  
  <!-- PWA相关meta标签 -->
  <meta name="theme-color" content="#FFF8F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="宝贝时光">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 高德地图 JS API - 用于定位功能 -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=71e345af2fc2aa22d97b3d73d5cf12c8"></script>
  
  <title>宝贝时光 - 记录宝宝成长点滴</title>
  <!-- 一门APP jsBridge SDK -->
  <script src="/jsbridge-mini.js"></script>
  
  <!-- JSZip - 用于ZIP打包导出 -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" crossorigin src="/assets/index-DAdsNgIq.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BvxNou9S.css">
</head>
<body class="bg-cream-50 dark:bg-gray-900">
  <div id="root"></div>
  
  <!-- 扣子 Chat SDK - 本地静态文件，确保加载成功 -->
  <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.0.0-beta.4/libs/cn/index.js"></script>
  
  <style>
  /* ===== 扣子 SDK 样式定制 - 强制隐藏美观输出 ===== */
  
  /* 1. 确保悬浮按钮正常显示并强制显示图标 */
  [class*="coze-chat-float-btn"],
  [class*="coze-chat"] [class*="float-btn"],
  [class*="coze-chat"] button[class*="float"],
  [class*="coze-chat"] button[class*="launcher"] {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    z-index: 9999 !important;
    pointer-events: auto !important;
  }
  
  /* 强制显示悬浮按钮内部的图标 */
  [class*="coze-chat-float-btn"] svg,
  [class*="coze-chat-float-btn"] img,
  [class*="coze-chat-float-btn"] [class*="icon"],
  [class*="coze-chat"] [class*="float-btn"] svg,
  [class*="coze-chat"] [class*="float-btn"] img {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    width: 28px !important;
    height: 28px !important;
  }
  
  /* 强制隐藏悬浮按钮中的文字（只显示图标） */
  [class*="coze-chat-float-btn"]:not(svg):not(img),
  [class*="coze-chat-float-btn"] span:not([class*="icon"]),
  [class*="coze-chat-float-btn"] div:not([class*="icon"]),
  [class*="coze-chat"] [class*="float-btn"]:not(svg):not(img) {
    font-size: 0 !important;
    color: transparent !important;
    text-indent: -9999px !important;
  }
  
  /* 2. 强制隐藏"美观输出"、"美化输出"、"美观"、"AI生成"相关的所有元素 */
  [class*="beautify"],
  [class*="beauty-output"],
  [class*="aesthetic"],
  [class*="ai-generate"],
  [class*="ai-generation"],
  [class*="generate-output"],
  [class*="coze-chat"] [class*="beautify"],
  [class*="coze-chat"] [class*="beauty"],
  [class*="coze-chat"] [class*="aesthetic"],
  [class*="coze-chat"] [class*="ai-"]:not([class*="avatar"]):not([class*="message"]) {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    width: 0 !important;
    height: 0 !important;
    overflow: hidden !important;
    position: absolute !important;
    left: -9999px !important;
  }
  
  /* 3. 隐藏包含"美观"/"美化"/"AI生成"文字的元素 */
  [class*="coze-chat"] [class*="action"]:has(:-webkit-any(:-webkit-any(:-webkit-any(:-webkit-any(:-webkit-any(*)))))) {
    /* 备用：如果JS代码生效，这部分不需要 */
  }
  
  /* 4. 隐藏头像（可选） - 如果需要隐藏头像启用下面的CSS */
  /*
  [class*="coze-chat"] [class*="avatar"],
  [class*="coze-chat"] [class*="user-avatar"],
  [class*="coze-chat"] [class*="bot-avatar"] {
    display: none !important;
  }
  */
  
  /* 5. 确保聊天窗口和输入框正常显示 */
  [class*="coze-chat"],
  [class*="coze-chat"] [class*="window"],
  [class*="coze-chat"] [class*="chat-window"],
  [class*="coze-chat"] [class*="input-area"],
  [class*="coze-chat"] textarea,
  [class*="coze-chat"] [class*="send-btn"] {
    display: block !important;
    visibility: visible !important;
  }
  
  /* 6. 隐藏输入框内的图标提示，保持输入框整洁 */
  [class*="coze-chat"] [class*="input-icon"],
  [class*="coze-chat"] [class*="placeholder-icon"] {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    min-width: 0 !important;
    min-height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  
  /* 7. 【新增】强制隐藏聊天输入框上方的美化按钮区域 */
  [class*="coze-chat"] [class*="input-toolbar"],
  [class*="coze-chat"] [class*="input-action"],
  [class*="coze-chat"] [class*="input-bar"],
  [class*="coze-chat"] [class*="rich-editor"],
  [class*="coze-chat"] [class*="editor-toolbar"],
  [class*="coze-chat"] [class*="format-toolbar"],
  [class*="coze-chat"] [class*="beautify-toolbar"] {
    display: none !important;
    height: 0 !important;
    min-height: 0 !important;
    overflow: hidden !important;
  }
  
  </style>

  <!-- SDK 初始化 - 最简单最基础的版本，确保按钮正常显示 -->
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const initSDK = () => {
      if (typeof CozeWebSDK !== 'undefined' && !window.cozeClient) {
        window.cozeClient = new CozeWebSDK.WebChatClient({
          config: { bot_id: '7636350042466418731' },
          componentProps: { title: '虚拟时光助手' },
        });
      }
    };
    initSDK();
    let cnt = 0;
    const t = setInterval(() => { if (++cnt >= 10 || window.cozeClient) clearInterval(t); else initSDK(); }, 500);
  });
  </script>
  
  <!-- PWA Service Worker 注册 - 简化版 -->
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(() => console.log('✅ PWA ready'))
      .catch(() => console.log('⚠️ Service Worker 暂不启用'));
  }
  </script>
  
</body>
</html>
