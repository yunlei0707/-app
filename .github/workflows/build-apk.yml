      - name: Capacitor sync
        run: |
          # 先删除所有旧配置，避免冲突
          rm -f capacitor.config.js capacitor.config.ts capacitor.config.json
          
          # 重新创建，webDir 写在配置里就够了
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.babytime.app",
            "appName": "宝贝时光",
            "webDir": "dist",
            "server": {
              "androidScheme": "http"
            }
          }
          EOF
          
          echo "=== Current directory ==="
          ls -la
          
          echo "=== dist directory has index.html: ==="
          ls -la dist/index.html
          
          # 安装 Capacitor
          npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev
          npm install @capacitor/camera @capacitor/filesystem @capacitor/share @capacitor/status-bar --save
          
          # 直接 sync，配置文件里的 webDir 会生效
          npx cap sync android
          
          echo "=== settings.gradle after sync ==="
          cat android/settings.gradle
