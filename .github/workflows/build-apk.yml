name: Build APK

on:
  push:
    branches: [ capacitor ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: echo '{"appId":"com.babytime.app","appName":"宝贝时光","webDir":"dist","server":{"androidScheme":"http"}}' > capacitor.config.json

      - name: Create www directory (Capacitor fallback)
        run: |
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev
          npm install @capacitor/camera @capacitor/filesystem @capacitor/share @capacitor/status-bar --save

      - name: Sync Android
        run: npx cap sync android

      - name: 🔥 ULTIMATE variables.gradle (ALL VARIABLES!)
        run: |
          cat > android/variables.gradle << 'VARS_EOF'
ext {
    // SDK Versions
    compileSdkVersion = 34
    buildToolsVersion = "34.0.0"
    minSdkVersion = 24
    targetSdkVersion = 34
    versionCode = 1
    versionName = "1.0"

    // AndroidX Core
    androidxAppCompatVersion = "1.6.1"
    androidxCoreVersion = "1.12.0"
    androidxCoreKtxVersion = "1.12.0"
    androidxActivityVersion = "1.8.2"
    androidxFragmentVersion = "1.6.2"
    androidxAppcompatVersion = "1.6.1"

    // AndroidX Layout & UI
    androidxConstraintLayoutVersion = "2.1.4"
    androidxCoordinatorLayoutVersion = "1.2.0"
    androidxRecyclerViewVersion = "1.3.2"
    androidxCardViewVersion = "1.0.0"
    androidxViewPager2Version = "1.0.0"
    androidxDrawerLayoutVersion = "1.2.0"
    androidxSlidingPaneLayoutVersion = "1.2.0"
    androidxSwiperefreshlayoutVersion = "1.1.0"
    androidxPreferenceVersion = "1.2.1"
    androidxLeanbackVersion = "1.0.0"

    // AndroidX Material
    materialVersion = "1.11.0"
    materialComponentsVersion = "1.11.0"
}
VARS_EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
