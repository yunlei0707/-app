name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Create www directory
        run: |
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 --save-dev --legacy-peer-deps
          npm install @capacitor/camera @capacitor/filesystem@^6.0.0 @capacitor/share @capacitor/status-bar --save --legacy-peer-deps

      - name: Clean old config
        run: rm -f capacitor.config.js capacitor.config.ts capacitor.config.json

      - name: Init Capacitor
        run: npx cap init "宝贝时光" com.babytime.app --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Create variables.gradle
        run: |
          echo ext { > android/variables.gradle
          echo compileSdkVersion = 36 >> android/variables.gradle
          echo buildToolsVersion = "34.0.0" >> android/variables.gradle
          echo minSdkVersion = 24 >> android/variables.gradle
          echo targetSdkVersion = 36 >> android/variables.gradle
          echo versionCode = 1 >> android/variables.gradle
          echo versionName = "1.0" >> android/variables.gradle
          echo androidxAppCompatVersion = "1.6.1" >> android/variables.gradle
          echo androidxCoreVersion = "1.12.0" >> android/variables.gradle
          echo androidxActivityVersion = "1.8.2" >> android/variables.gradle
          echo androidxConstraintLayoutVersion = "2.1.4" >> android/variables.gradle
          echo androidxCoordinatorLayoutVersion = "1.2.0" >> android/variables.gradle
          echo materialVersion = "1.11.0" >> android/variables.gradle
          echo coreSplashScreenVersion = "1.0.1" >> android/variables.gradle
          echo junitVersion = "4.13.2" >> android/variables.gradle
          echo androidxJunitVersion = "1.1.5" >> android/variables.gradle
          echo androidxEspressoCoreVersion = "3.5.1" >> android/variables.gradle
          echo } >> android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
