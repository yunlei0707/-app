name: Build APK

on:
  push:
    branches: [main, capacitor]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Configure pnpm registry
        run: pnpm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

      - name: Copy Capacitor web assets
        run: pnpm exec cap copy android

      - name: Build APK
        id: build_apk
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Gradle build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            {
              echo "GRADLE_LOG_TAIL<<EOF"
              tail -n 40 gradle-build.log
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Report Gradle failure
        if: failure() && steps.build_apk.outputs.GRADLE_LOG_TAIL != ''
        run: |
          while IFS= read -r line; do
            echo "::error file=gradle-build.log::${line}"
          done <<< "${{ steps.build_apk.outputs.GRADLE_LOG_TAIL }}"

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
