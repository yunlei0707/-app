name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Create www directory (Capacitor fallback)
        run: |
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev
          npm install @capacitor/camera @capacitor/filesystem @capacitor/share @capacitor/status-bar --save

      - name: Clean old Capacitor config
        run: rm -f capacitor.config.js capacitor.config.ts capacitor.config.json

      - name: Init Capacitor
        run: npx cap init "宝贝时光" com.babytime.app --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android
