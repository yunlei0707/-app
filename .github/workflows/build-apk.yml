name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Move Android files to android/
        run: |
          mkdir -p android
          [ -d "app" ] && mv app android/
          [ -d "gradle" ] && mv gradle android/
          [ -f "build.gradle" ] && mv build.gradle android/
          [ -f "settings.gradle" ] && mv settings.gradle android/
          [ -f "gradle.properties" ] && mv gradle.properties android/
          [ -f "gradlew" ] && mv gradlew android/
          [ -f "gradlew.bat" ] && mv gradlew.bat android/
          ls -la android/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Capacitor sync (force mode)
        run: |
          echo '{"appId":"com.babytime.app","appName":"宝贝时光","webDir":"dist","server":{"androidScheme":"http"}}' > capacitor.config.json
          
          # 必杀技：创建 www 目录！
          cp -r dist www
          echo "www directory created:"
          ls -la www/
          
          npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create variables.gradle
        run: cd android && echo -e "ext {\n    compileSdkVersion = 34\n    buildToolsVersion = \"34.0.0\"\n    minSdkVersion = 24\n    targetSdkVersion = 34\n    versionCode = 1\n    versionName = \"1.0\"\n}" > variables.gradle && cat variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
