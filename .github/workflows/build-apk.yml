name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # cache: 'pnpm' # 等第一次生成pnpm-lock.yaml后再开启

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Create www directory
        run: |
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          pnpm add @capacitor/cli @capacitor/core @capacitor/android -D
          pnpm add @capacitor/camera @capacitor/filesystem @capacitor/share @capacitor/status-bar

      - name: Clean old config
        run: rm -f capacitor.config.js capacitor.config.ts capacitor.config.json

      - name: Init Capacitor
        run: npx cap init "宝贝时光" com.babytime.app --web-dir dist

      - name: Add Android
        run: |
          # 先保存我们的配置文件
          mkdir -p /tmp/android_configs
          if [ -d android/app/src/main/ ]; then
            cp -r android/app/src/main/* /tmp/android_configs/
            echo "保存配置文件到临时目录"
          fi
          # 删除旧目录重新生成
          rm -rf android
          npx cap add android

      - name: Apply custom Android configs
        run: |
          # 把我们的权限配置文件覆盖到新生成的 android 目录
          if [ -f /tmp/android_configs/AndroidManifest.xml ]; then
            cp -f /tmp/android_configs/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "已应用自定义 AndroidManifest.xml"
          fi
          if [ -f /tmp/android_configs/res/xml/file_paths.xml ]; then
            mkdir -p android/app/src/main/res/xml
            cp -f /tmp/android_configs/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
            echo "已应用自定义 file_paths.xml"
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
