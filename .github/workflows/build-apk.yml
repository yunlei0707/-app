name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: echo '{"appId":"com.babytime.app","appName":"宝贝时光","webDir":"dist","server":{"androidScheme":"http"}}' > capacitor.config.json

      - name: Create www directory (Capacitor fallback)
        run: |
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev
          npm install @capacitor/camera @capacitor/filesystem @capacitor/share @capacitor/status-bar --save

      - name: Sync Android
        run: npx cap sync android

      - name: 🔥 ULTIMATE variables.gradle (ALL VARIABLES!)
        run: |
          > android/variables.gradle
          echo "ext {" >> android/variables.gradle
          echo "    // SDK Versions" >> android/variables.gradle
          echo "    compileSdkVersion = 34" >> android/variables.gradle
          echo '    buildToolsVersion = "34.0.0"' >> android/variables.gradle
          echo "    minSdkVersion = 24" >> android/variables.gradle
          echo "    targetSdkVersion = 34" >> android/variables.gradle
          echo "    versionCode = 1" >> android/variables.gradle
          echo '    versionName = "1.0"' >> android/variables.gradle
          echo "" >> android/variables.gradle
          echo "    // AndroidX Core" >> android/variables.gradle
          echo '    androidxAppCompatVersion = "1.6.1"' >> android/variables.gradle
          echo '    androidxCoreVersion = "1.12.0"' >> android/variables.gradle
          echo '    androidxCoreKtxVersion = "1.12.0"' >> android/variables.gradle
          echo '    androidxActivityVersion = "1.8.2"' >> android/variables.gradle
          echo '    androidxFragmentVersion = "1.6.2"' >> android/variables.gradle
          echo '    androidxAppcompatVersion = "1.6.1"' >> android/variables.gradle
          echo "" >> android/variables.gradle
          echo "    // AndroidX Layout & UI" >> android/variables.gradle
          echo '    androidxConstraintLayoutVersion = "2.1.4"' >> android/variables.gradle
          echo '    androidxCoordinatorLayoutVersion = "1.2.0"' >> android/variables.gradle
          echo '    androidxRecyclerViewVersion = "1.3.2"' >> android/variables.gradle
          echo '    androidxCardViewVersion = "1.0.0"' >> android/variables.gradle
          echo '    androidxViewPager2Version = "1.0.0"' >> android/variables.gradle
          echo '    androidxDrawerLayoutVersion = "1.2.0"' >> android/variables.gradle
          echo '    androidxSlidingPaneLayoutVersion = "1.2.0"' >> android/variables.gradle
          echo '    androidxSwiperefreshlayoutVersion = "1.1.0"' >> android/variables.gradle
          echo '    androidxPreferenceVersion = "1.2.1"' >> android/variables.gradle
          echo '    androidxLeanbackVersion = "1.0.0"' >> android/variables.gradle
          echo "" >> android/variables.gradle
          echo "    // AndroidX Material" >> android/variables.gradle
          echo '    materialVersion = "1.11.0"' >> android/variables.gradle
          echo '    materialComponentsVersion = "1.11.0"' >> android/variables.gradle
          echo "}" >> android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
