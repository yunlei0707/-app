- name: Generate missing build files from fresh Capacitor
  run: |
    # 创建临时目录，生成一个全新的完整 Android 项目
    mkdir -p /tmp/fresh-app
    cd /tmp/fresh-app
    echo '{"appId":"com.babytime.app","appName":"宝贝时光","webDir":"www"}' > capacitor.config.json
    mkdir www
    echo "test" > www/index.html
    
    # 直接用绝对路径调用！不用 npx 了！
    $GITHUB_WORKSPACE/node_modules/.bin/cap add android
    $GITHUB_WORKSPACE/node_modules/.bin/cap sync android
    
    # 把构建文件复制回来（保留我们原来的 src/main 配置！）
    cp /tmp/fresh-app/android/gradlew $GITHUB_WORKSPACE/android/
    cp /tmp/fresh-app/android/gradle.bat $GITHUB_WORKSPACE/android/ 2>/dev/null || true
    cp /tmp/fresh-app/android/settings.gradle $GITHUB_WORKSPACE/android/
    cp /tmp/fresh-app/android/build.gradle $GITHUB_WORKSPACE/android/
    cp /tmp/fresh-app/android/app/build.gradle $GITHUB_WORKSPACE/android/app/
    cp -r /tmp/fresh-app/android/gradle $GITHUB_WORKSPACE/android/
    cp /tmp/fresh-app/android/gradle.properties $GITHUB_WORKSPACE/android/
    
    # 给执行权限
    chmod +x $GITHUB_WORKSPACE/android/gradlew
    
    # 列出文件确认一下
    echo "=== Android files now ==="
    ls -la $GITHUB_WORKSPACE/android/
