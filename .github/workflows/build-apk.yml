      - name: Create complete variables.gradle
        run: |
          cd android
          
          cat > variables.gradle << 'EOF'
ext {
    // SDK 版本
    compileSdkVersion = 34
    buildToolsVersion = "34.0.0"
    minSdkVersion = 24
    targetSdkVersion = 34
    
    // 应用版本
    versionCode = 1
    versionName = "1.0"
    
    // AndroidX 版本
    androidxAppCompatVersion = "1.6.1"
    androidxCoreVersion = "1.12.0"
    androidxConstraintLayoutVersion = "2.1.4"
    materialVersion = "1.11.0"
    
    // 测试相关
    junitVersion = "4.13.2"
    androidJunitVersion = "1.1.5"
    espressoVersion = "3.5.1"
}
EOF
          
          echo "variables.gradle created with all versions:"
          cat variables.gradle
