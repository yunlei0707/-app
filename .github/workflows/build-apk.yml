name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android typescript --save-dev

      - name: Build frontend
        run: npm run build

      - name: Generate fresh Android project with Capacitor
        run: |
          # 创建临时的 JSON 配置文件（Capacitor 认这个）
          echo '{
            "appId": "com.babytime.app",
            "appName": "宝贝时光",
            "webDir": "dist",
            "server": {
              "androidScheme": "http"
            }
          }' > capacitor.config.json
          
          # 删除旧的 android 文件夹，重新生成一个全新的
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
