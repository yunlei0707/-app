name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Create www directory (Capacitor fallback)
        run: |
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev
          npm install @capacitor/camera @capacitor/filesystem @capacitor/share @capacitor/status-bar --save

      - name: Clean old Capacitor config
        run: rm -f capacitor.config.js capacitor.config.ts capacitor.config.json

      - name: Init Capacitor
        run: npx cap init "宝贝时光" com.babytime.app --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: 🔥 创建variables.gradle（全量版本）
        run: |
          cat > android/variables.gradle << 'EOF'
ext {
    // SDK 版本
    compileSdkVersion = 34
    buildToolsVersion = "34.0.0"
    minSdkVersion = 24
    targetSdkVersion = 34
    versionCode = 1
    versionName = "1.0"

    // AndroidX 核心库
    androidxAppCompatVersion = "1.6.1"
    androidxCoreVersion = "1.12.0"
    androidxCoreKtxVersion = "1.12.0"
    androidxActivityVersion = "1.8.2"
    androidxFragmentVersion = "1.6.2"
    androidxAppcompatVersion = "1.6.1"

    // AndroidX 布局与UI
    androidxConstraintLayoutVersion = "2.1.4"
    androidxCoordinatorLayoutVersion = "1.2.0"
    androidxRecyclerViewVersion = "1.3.2"
    androidxCardViewVersion = "1.0.0"
    androidxViewPager2Version = "1.0.0"
    androidxDrawerLayoutVersion = "1.2.0"
    androidxSlidingPaneLayoutVersion = "1.2.0"
    androidxSwiperefreshlayoutVersion = "1.1.0"
    androidxPreferenceVersion = "1.2.1"
    androidxLeanbackVersion = "1.0.0"

    // Material Design
    materialVersion = "1.11.0"
    materialComponentsVersion = "1.11.0"

    // 启动页与浏览器
    coreSplashScreenVersion = "1.0.1"
    browserVersion = "1.7.0"
    androidxWebkitVersion = "1.7.0"

    // 测试相关
    junitVersion = "4.13.2"
    junitExtVersion = "1.1.5"
    espressoVersion = "3.5.1"
}
EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
